/* ==========================================================================
   Booked & Busy — shared styles for every city.
   Each city's colors and fonts come from cities/<city>/theme.css (added after this file).
   ========================================================================== */
:root {
  /* colors, fonts and shadows live in cities/<city>/theme.css */
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);

  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 400 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
/* faint paper grain */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image:
    radial-gradient(rgba(145,96,42,.05) 1px, transparent 1px),
    radial-gradient(rgba(47,61,51,.035) 1px, transparent 1px);
  background-size: 22px 22px, 13px 13px;
  background-position: 0 0, 7px 9px;
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0; line-height: 1.12; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--ochre); }
:focus-visible { outline: 2.5px solid var(--sage-deep); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hand { font-family: var(--f-hand); font-weight: 600; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- App shell ---------- */
.app { position: relative; z-index: 1; min-height: 100vh; }
.sidebar { display: none; }
.main { padding: 0 16px calc(var(--nav-h) + var(--safe-b) + 28px); max-width: 1120px; margin: 0 auto; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  margin: 0 -16px 14px; padding: 10px 16px;
  background: color-mix(in srgb, var(--cream) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brandmark { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.brandmark b { font: italic 500 19px/1 var(--f-display); letter-spacing: -.02em; white-space: nowrap; }
.brandmark b i { color: var(--ochre); font-style: italic; }
.edition-chip {
  font: 700 10px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase;
  background: var(--mint); color: var(--sage-deep); padding: 5px 7px; border-radius: 99px; white-space: nowrap;
}
.topbar .spacer { flex: 1; }
.topbar .title-sm { font: 500 13px/1.2 var(--f-body); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }

/* Bottom nav (mobile) */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px -18px rgba(47,61,51,.4);
}
.bottomnav button {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: 600 11px/1 var(--f-body); color: var(--ink-3); position: relative; transition: color .2s;
}
.bottomnav button .ico { width: 26px; height: 26px; font-size: 20px; transition: transform .35s var(--spring); }
.bottomnav button[aria-current="page"] { color: var(--espresso); }
.bottomnav button[aria-current="page"] .ico { transform: translateY(-2px) scale(1.1); }
.bottomnav button[aria-current="page"]::before {
  content: ""; position: absolute; top: 6px; width: 40px; height: 32px; border-radius: 12px; background: var(--mint); z-index: -1;
  animation: pop .35s var(--spring);
}

/* Icon slots: <img> if the PNG exists, emoji otherwise */
.ico { display: inline-grid; place-items: center; width: 22px; height: 22px; font-size: 17px; line-height: 1; flex: none; }
.ico img { width: 100%; height: 100%; object-fit: contain; }

/* Desktop */
@media (min-width: 960px) {
  .sidebar {
    display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; width: 256px; z-index: 25;
    padding: 22px 16px 18px; background: var(--paper); border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  .main { margin-left: 256px; padding: 0 36px 60px; }
  .topbar { margin: 0 -36px 22px; padding: 14px 36px; }
  .topbar .brandmark { display: none; }
  .bottomnav { display: none; }
  .only-mobile { display: none !important; }
}
@media (min-width: 1380px) { .main { margin-left: calc(256px + (100vw - 256px - 1120px) / 2); } }
@media (max-width: 959.98px) { .only-desktop { display: none !important; } }

.side-brand { padding: 4px 8px 18px; position: relative; }
.side-brand .wordmark { font: italic 500 28px/1 var(--f-display); letter-spacing: -.03em; }
.side-brand .wordmark i { color: var(--ochre); }
.side-brand .tagline { font: 600 19px/1 var(--f-hand); color: var(--sage-deep); margin-top: 6px; transform: rotate(-2deg); display: inline-block; }
.side-brand .edition-chip { position: absolute; right: 6px; top: 0; transform: rotate(4deg); }
.navlist { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.navlist button {
  width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 12px; border: 0; border-radius: 12px;
  background: none; text-align: left; font: 500 14.5px/1.2 var(--f-body); color: var(--ink-2);
  transition: background .2s, color .2s, transform .2s var(--ease);
}
.navlist button:hover { background: var(--cream); color: var(--ink); transform: translateX(2px); }
.navlist button[aria-current="page"] { background: var(--mint); color: var(--espresso); font-weight: 700; }
.navlist .badge { margin-left: auto; }
.nav-group { font: 700 10px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); padding: 16px 12px 6px; }
.side-foot { margin-top: auto; padding-top: 18px; }

/* ---------- Views ---------- */
.view-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin: 6px 0 18px; }
.view-head .eyebrow { font: 700 11px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ochre); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.view-head h1 { font-size: clamp(30px, 7vw, 44px); }
.view-head h1 em { font-style: italic; font-weight: 500; color: var(--ochre); }
.view-head .lede { color: var(--ink-2); margin-top: 8px; max-width: 58ch; }
.view-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.view-enter { animation: viewIn .45s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }

.grid { display: grid; gap: 14px; }
@media (min-width: 720px) {
  .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .span-2 { grid-column: span 2; }
}
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.section { margin-top: 26px; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 21px; }
.section-title .count { font: 600 13px/1 var(--f-body); color: var(--ink-3); }

/* ---------- Cards ---------- */
.card {
  position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; box-shadow: var(--shadow-1);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s;
}
.card.lift:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
.card.mint { background: var(--mint); border-color: transparent; }
.card.ochre { background: var(--ochre-soft); border-color: transparent; }
.card.espresso { background: var(--espresso); color: var(--cream); border-color: transparent; }
.card h3 { font-size: 19px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-head h3 { flex: 1; min-width: 0; }
.kicker { font: 700 10.5px/1 var(--f-body); letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); }
.card.espresso .kicker { color: rgba(251,246,236,.6); }

/* washi tape accent */
.washi { position: relative; }
.washi::before {
  content: ""; position: absolute; top: -11px; left: 22px; width: 92px; height: 22px; z-index: 2;
  transform: rotate(-4deg); opacity: .9;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px),
    var(--tape, var(--sage));
  clip-path: polygon(3% 0, 97% 4%, 100% 20%, 97% 38%, 100% 58%, 97% 78%, 100% 100%, 2% 96%, 0 78%, 3% 60%, 0 40%, 3% 20%);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.washi.ochre-tape { --tape: #D8B07E; }
.washi.mint-tape { --tape: var(--mint-2); }
.washi.right::before { left: auto; right: 22px; transform: rotate(5deg); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 999px; border: 1.5px solid var(--espresso); background: var(--paper); color: var(--espresso);
  font: 600 14px/1 var(--f-body); white-space: nowrap; text-decoration: none;
  transition: transform .18s var(--ease), background .2s, box-shadow .2s, color .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 -1px var(--espresso); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.primary { background: var(--ochre); border-color: var(--ochre); color: #FFFBF2; }
.btn.primary:hover { box-shadow: 0 4px 0 -1px #1A665F; }
.btn.dark { background: var(--espresso); color: var(--cream); }
.btn.sage { background: var(--sage); border-color: var(--sage); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--cream-2); box-shadow: none; }
.btn.small { min-height: 34px; padding: 0 13px; font-size: 13px; }
.btn.block { width: 100%; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid transparent; background: transparent;
  display: inline-grid; place-items: center; color: var(--ink-2); font-size: 17px; flex: none;
  transition: background .2s, color .2s, transform .2s var(--ease);
}
.icon-btn:hover { background: var(--cream-2); color: var(--ink); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.danger:hover { background: var(--red-soft); color: var(--red); }
.icon-btn svg { width: 18px; height: 18px; }
.linkish { border: 0; background: none; padding: 0; color: var(--ochre); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }

/* ---------- Form bits ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font: 600 12.5px/1.2 var(--f-body); color: var(--ink-2); }
.field > small { color: var(--ink-3); font-size: 12px; }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 13px; border-radius: 12px; border: 1.5px solid var(--line-2);
  background: var(--paper); font-size: 16px; /* 16px stops iOS zoom */
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sage-deep); box-shadow: 0 0 0 4px rgba(130,172,157,.25); }
.textarea { resize: vertical; min-height: 92px; line-height: 1.5; }
.select { appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.select.inline { min-height: 34px; padding: 4px 30px 4px 10px; font-size: 14px; border-radius: 99px; width: auto; max-width: 100%;
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; }
.input.bare, .textarea.bare { border-color: transparent; background: transparent; padding-left: 0; padding-right: 0; }
.input.bare:hover, .textarea.bare:hover { background: rgba(47,61,51,.03); }
.input.bare:focus, .textarea.bare:focus { background: var(--paper); padding-left: 10px; padding-right: 10px; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.money-input { position: relative; }
.money-input .cur { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 600; pointer-events: none; }
.money-input .input { padding-left: 30px; }

/* Segmented control */
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 99px; background: var(--cream-2); border: 1px solid var(--line); max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 9px 16px; border-radius: 99px; font: 600 13.5px/1 var(--f-body); color: var(--ink-2); white-space: nowrap; transition: background .25s, color .25s, box-shadow .25s; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--espresso); box-shadow: var(--shadow-1); }

/* ---------- Checkbox with draw-on tick ---------- */
.check { position: relative; display: inline-grid; place-items: center; width: 26px; height: 26px; flex: none; cursor: pointer; }
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check .box {
  width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-2); background: var(--paper);
  display: grid; place-items: center; transition: background .25s, border-color .25s, transform .3s var(--spring);
}
.check svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .3s var(--ease) .05s; }
.check input:checked + .box { background: var(--sage-deep); border-color: var(--sage-deep); animation: pop .35s var(--spring); }
.check input:checked + .box svg { stroke-dashoffset: 0; }
.check input:focus-visible + .box { outline: 2.5px solid var(--ochre); outline-offset: 2px; }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* toggle switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 42px; height: 24px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .25s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .3s var(--spring); }
.switch input:checked + .track { background: var(--sage-deep); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 2.5px solid var(--ochre); outline-offset: 2px; }

/* ---------- Progress ---------- */
.bar { height: 10px; border-radius: 99px; background: var(--cream-2); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; width: var(--p, 0%); border-radius: inherit; background: var(--sage-deep); transition: width .6s var(--ease); }
.bar.ochre > i { background: var(--ochre); }
.bar.over > i { background: var(--red); }
.bar.thin { height: 6px; }
.bar.fat { height: 14px; }
.view-enter .bar > i { animation: grow 1s var(--ease) both; }
@keyframes grow { from { width: 0; } }

/* ---------- Chips & badges ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font: 600 12.5px/1.1 var(--f-body);
  background: var(--cream-2); color: var(--ink-2); border: 1px solid transparent; white-space: nowrap;
}
.chip.mint { background: var(--mint); color: var(--sage-deep); }
.chip.ochre { background: var(--ochre-soft); color: var(--ochre); }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.amber { background: var(--amber-soft); color: #8A5C0B; }
.chip.green { background: var(--mint); color: var(--sage-deep); }
.chip.outline { background: transparent; border-color: var(--line-2); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; font: 700 11px/1 var(--f-body); background: var(--red); color: #fff; }
.badge.soft { background: var(--cream-2); color: var(--ink-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.red { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.dot.amber { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.dot.green { background: var(--sage); box-shadow: 0 0 0 3px var(--mint); }
.dot.done { background: var(--ink-3); }

/* guest avatars + toggle chips */
.avatar {
  --c: var(--sage); width: 34px; height: 34px; border-radius: 50%; flex: none; display: inline-grid; place-items: center;
  background: var(--c); color: #fff; font: 700 13px/1 var(--f-body); letter-spacing: .02em; border: 2px solid var(--paper);
}
.avatar.lg { width: 46px; height: 46px; font-size: 17px; }
.avatar.sm { width: 26px; height: 26px; font-size: 11px; }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -8px; }
.gchip {
  --c: var(--sage); display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 3px 12px 3px 3px; border-radius: 99px;
  border: 1.5px solid var(--line-2); background: var(--paper); font: 600 13px/1 var(--f-body); color: var(--ink-2);
  transition: background .2s, border-color .2s, color .2s, transform .25s var(--spring);
}
.gchip .avatar { width: 28px; height: 28px; font-size: 11px; border: 0; background: var(--cream-2); color: var(--ink-2); transition: background .2s, color .2s; }
.gchip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--paper)); color: var(--ink); }
.gchip[aria-pressed="true"] .avatar { background: var(--c); color: #fff; }
.gchip:active { transform: scale(.94); }
.gchips { display: flex; flex-wrap: wrap; gap: 7px; }

/* ---------- Empty states ---------- */
.empty {
  text-align: center; padding: 34px 20px; border: 1.5px dashed var(--line-2); border-radius: var(--r); background: rgba(255,253,248,.6);
}
.empty .art { font-size: 38px; margin-bottom: 8px; display: inline-block; transform: rotate(-6deg); }
.empty h3 { font-size: 21px; margin-bottom: 6px; }
.empty p { color: var(--ink-2); max-width: 40ch; margin: 0 auto 14px; }
.empty .hand { font-size: 20px; color: var(--sage-deep); display: block; margin-bottom: 4px; }

/* ==========================================================================
   HOME — hero, postmark, stats, quick links
   ========================================================================== */
.hero { position: relative; margin: 4px 0 22px; }
.hero-photo {
  position: relative; border-radius: var(--r-lg) var(--r-lg) 0 0; overflow: hidden; min-height: 360px;
  background: var(--espresso); box-shadow: var(--shadow-2);
  /* torn paper bottom edge */
  clip-path: polygon(0 0, 100% 0, 100% 96%, 97% 98.6%, 94% 96.4%, 90.5% 99.2%, 87% 96.8%, 83% 98.9%, 79.5% 96.2%, 75% 99.4%, 71% 97%, 67.5% 98.8%, 63% 96.1%, 59% 99.3%, 55.5% 97.1%, 51% 98.7%, 47% 96.3%, 43.5% 99.5%, 39% 97.2%, 35% 98.9%, 31.5% 96%, 27% 99.1%, 23% 96.9%, 19.5% 98.6%, 15% 96.2%, 11% 99.4%, 7.5% 97%, 3.5% 98.8%, 0 96.5%);
}
.hero-photo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(47,61,51,.05) 30%, rgba(47,61,51,.55) 100%); pointer-events: none; }
.hero-art { position: absolute; inset: 0; }
.hero-art svg { width: 100%; height: 100%; display: block; }
.hero-inner { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; min-height: 360px; padding: 20px 18px 38px; }
.hero-card {
  background: var(--paper); border-radius: 14px; padding: 16px 16px 14px; max-width: 520px; box-shadow: var(--shadow-3);
  transform: rotate(-1deg); position: relative;
}
.hero-card .kicker { color: var(--ochre); display: flex; align-items: center; gap: 8px; }
.trip-name {
  width: 100%; border: 0; background: transparent; padding: 4px 0 2px; margin: 4px 0 2px;
  font: 600 clamp(28px, 7.5vw, 46px)/1.05 var(--f-display); letter-spacing: -.02em; color: var(--espresso);
  border-bottom: 1.5px dashed transparent; border-radius: 0; transition: border-color .2s;
  resize: none; overflow: hidden; display: block;
}
.trip-name:hover, .trip-name:focus { border-bottom-color: var(--line-2); outline: none; }
.date-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.date-row input[type=date] {
  border: 1.5px solid var(--line); background: var(--cream); border-radius: 99px; padding: 6px 10px; min-height: 36px;
  font: 600 13.5px/1 var(--f-body); color: var(--ink); max-width: 160px;
}
.date-row .arrow { color: var(--ink-3); }
.hero-tools { position: absolute; top: 14px; left: 14px; z-index: 3; display: flex; gap: 6px; }
.hero-tools .btn { background: rgba(255,253,248,.88); border-color: transparent; backdrop-filter: blur(6px); }

/* postage stamp + postmark countdown */
.stamp-wrap { position: absolute; top: 14px; right: 14px; z-index: 3; transform: rotate(6deg); animation: stampIn .8s var(--spring) .15s both; }
@keyframes stampIn { from { opacity: 0; transform: rotate(18deg) scale(1.5); } }
.stamp {
  width: 120px; padding: 9px; background: var(--paper);
  -webkit-mask: linear-gradient(#000 0 0) center / calc(100% - 10px) calc(100% - 10px) no-repeat, radial-gradient(circle, transparent 3px, #000 3.6px) -5px -5px / 10px 10px round;
          mask: linear-gradient(#000 0 0) center / calc(100% - 10px) calc(100% - 10px) no-repeat, radial-gradient(circle, transparent 3px, #000 3.6px) -5px -5px / 10px 10px round;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
}
.stamp-inner {
  border: 1.5px solid var(--ochre); padding: 10px 4px 8px; text-align: center; background: var(--mint);
  background-image: radial-gradient(circle at 80% 0, rgba(255,255,255,.7), transparent 60%);
}
.stamp-inner .big { font: 600 44px/0.95 var(--f-display); color: var(--espresso); letter-spacing: -.03em; }
.stamp-inner .lbl { font: 700 9.5px/1.15 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--sage-deep); }
.stamp-inner .roma { font: italic 500 13px/1 var(--f-display); color: var(--ochre); margin-bottom: 4px; }
.postmark {
  position: absolute; left: -62px; top: 58px; width: 84px; height: 84px; border-radius: 50%;
  border: 2px solid rgba(47,61,51,.55); display: grid; place-items: center; text-align: center;
  font: 700 8.5px/1.2 var(--f-body); letter-spacing: .12em; color: rgba(47,61,51,.62); text-transform: uppercase;
  transform: rotate(-18deg); mix-blend-mode: multiply;
}
.postmark::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1px solid rgba(47,61,51,.4); }
.postmark .wave { position: absolute; left: -64px; top: 26px; width: 70px; height: 30px; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 900px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; border: 1px solid var(--line); cursor: pointer; font: inherit; color: inherit; }
.stat .v { font: 600 27px/1 var(--f-display); letter-spacing: -.02em; }
.stat .v small { font: 600 13px/1 var(--f-body); color: var(--ink-3); letter-spacing: 0; }
.stat .s { font-size: 12.5px; color: var(--ink-2); }
.stat .ico { position: absolute; top: 12px; right: 12px; opacity: .9; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  position: relative; min-height: 132px; padding: 16px; border-radius: var(--r); border: 0; text-align: left; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px; color: var(--espresso);
  box-shadow: var(--shadow-1); transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.tile:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: var(--shadow-2); }
.tile:nth-child(even):hover { transform: translateY(-4px) rotate(.6deg); }
.tile .ico { width: 40px; height: 40px; font-size: 30px; }
.tile b { font: 600 20px/1.1 var(--f-display); display: block; }
.tile span { font-size: 12.5px; color: var(--ink-2); }
.tile .go { position: absolute; right: 14px; bottom: 14px; font-size: 18px; transition: transform .3s var(--ease); }
.tile:hover .go { transform: translateX(4px); }
.tile.t1 { background: var(--mint); }
.tile.t2 { background: var(--ochre-soft); }
.tile.t3 { background: #F3E5CA; }
.tile.t4 { background: #DCE8E3; }

/* ==========================================================================
   DASHBOARD
   ========================================================================== */
.today-card { overflow: hidden; }
.today-card .dayname { font: italic 500 15px/1 var(--f-display); color: var(--ochre); }
.agenda { list-style: none; margin: 0; padding: 0; position: relative; }
.agenda li { display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
.agenda li:first-child { border-top: 0; }
.agenda .t { font: 700 13px/1.4 var(--f-body); color: var(--ochre); font-variant-numeric: tabular-nums; }
.agenda .ti { font-weight: 600; }
.agenda .no { font-size: 13px; color: var(--ink-2); }
.todo-list { list-style: none; padding: 0; margin: 0; }
.todo-list li + li { border-top: 1px solid var(--line); }
.todo-list button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 2px; border: 0; background: none; text-align: left; font: inherit; color: inherit; }
.todo-list .n { font: 600 24px/1 var(--f-display); min-width: 36px; text-align: center; }
.todo-list .n.zero { color: var(--sage-deep); }
.todo-list .lbl { flex: 1; }
.todo-list .lbl small { display: block; color: var(--ink-3); font-size: 12.5px; }
.todo-list .chev { color: var(--ink-3); transition: transform .2s; }
.todo-list button:hover .chev { transform: translateX(3px); color: var(--ochre); }

/* ==========================================================================
   VIBE VOTE
   ========================================================================== */
.vote-list { display: flex; flex-direction: column; gap: 12px; }
.vote-item { display: grid; grid-template-columns: auto 1fr; gap: 12px 14px; }
.vote-rank {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--cream-2);
  font: 600 18px/1 var(--f-display); color: var(--ink-2); transform: rotate(-4deg);
}
.vote-item.leader .vote-rank { background: var(--ochre); color: #fff; }
.vote-item.leader { border-color: rgba(145,96,42,.35); }
.vote-item h3 { font-size: 18px; }
.vote-item .note { color: var(--ink-2); font-size: 13.5px; margin-top: 3px; }
.vote-meter { display: flex; align-items: center; gap: 10px; margin: 10px 0 12px; }
.vote-meter .bar { flex: 1; }
.vote-meter .lbl { font: 600 12.5px/1.2 var(--f-body); color: var(--ink-2); white-space: nowrap; }
.vote-body { min-width: 0; }
.vote-top { display: flex; align-items: flex-start; gap: 8px; }
.vote-top > div { flex: 1; min-width: 0; }
@media (max-width: 520px) { .vote-item { grid-template-columns: 1fr; } .vote-rank { position: absolute; top: -10px; left: -6px; width: 34px; height: 34px; font-size: 16px; } .vote-item { padding-top: 22px; } }
.crown { font-family: var(--f-hand); color: var(--ochre); font-size: 18px; }

/* ==========================================================================
   ITINERARY
   ========================================================================== */
.daypills { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; margin: 0 -16px 8px; scrollbar-width: none; position: sticky; top: 58px; z-index: 10; background: linear-gradient(var(--cream) 80%, transparent); }
.daypills::-webkit-scrollbar { display: none; }
@media (min-width: 960px) { .daypills { top: 66px; margin: 0 -36px 8px; padding: 4px 36px 10px; } }
.daypill {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 14px; min-width: 62px;
  border: 1.5px solid var(--line); background: var(--paper); font: 600 11px/1 var(--f-body); color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em;
  transition: transform .2s var(--ease), background .2s, border-color .2s;
}
.daypill b { font: 600 22px/1 var(--f-display); color: var(--espresso); letter-spacing: -.02em; text-transform: none; }
.daypill:hover { transform: translateY(-2px); border-color: var(--sage); }
.daypill.today { background: var(--espresso); color: var(--cream); border-color: var(--espresso); }
.daypill.today b { color: var(--cream); }
.day-card { padding: 18px 16px 12px; scroll-margin-top: 140px; }
.day-card.is-today { border: 2px solid var(--ochre); }
.day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.day-head .dnum { font: 700 11px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--sage-deep); }
.day-head h3 { font-size: 23px; }
.day-head .hand { color: var(--ochre); font-size: 19px; margin-left: auto; }
.slot {
  display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: start; padding: 12px 8px; margin: 0 -8px; border-radius: 12px;
  border: 0; background: none; text-align: left; width: calc(100% + 16px); font: inherit; color: inherit; position: relative;
  transition: background .2s;
}
.slot + .slot::before { content: ""; position: absolute; top: 0; left: 8px; right: 8px; border-top: 1px dashed var(--line); }

.person-cell { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.expense {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 8px; margin: 0 -8px;
  border: 0; background: none; width: calc(100% + 16px); text-align: left; font: inherit; color: inherit; border-radius: 12px; transition: background .2s;
}
.expense:hover { background: var(--cream); }

/* ==========================================================================

.ticket {
  --band: var(--sage); position: relative; display: grid; grid-template-columns: 1fr; background: var(--paper);

}

}
.tk-stub::before, .tk-stub::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--cream); border: 1px solid var(--line); }

.tip { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--mint); font-size: 13.5px; color: #2F5549; position: relative; }

/* ==========================================================================

.pack-people { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 12px; margin: 0 -16px; scrollbar-width: none; }

.add-inline { display: flex; gap: 8px; padding: 10px 0 6px; }

/* ==========================================================================

   ========================================================================== */

  transform: rotate(var(--rot, -1.5deg)); transition: transform .3s var(--spring), box-shadow .3s;
}
.polaroid:hover { transform: rotate(0deg) translateY(-4px) scale(1.02); box-shadow: var(--shadow-3); z-index: 2; position: relative; }
.polaroid .pic { aspect-ratio: 4 / 3; border-radius: 2px; overflow: hidden; display: grid; place-items: center; font-size: 42px; position: relative; }
.polaroid .pic img { width: 100%; height: 100%; object-fit: cover; }

  font: 700 10px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; padding: 5px 7px; border-radius: 4px;
}
.kind-tag { font: 700 10px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--sage-deep); margin: 0 2px; }

/* ==========================================================================
   MEMORIES
   ========================================================================== */
.journal { display: flex; flex-direction: column; gap: 22px; }
.entry { display: grid; gap: 14px; padding: 20px 16px 16px; }
@media (min-width: 720px) { .entry { grid-template-columns: 220px 1fr; padding: 22px; } }
.entry-photo {
  aspect-ratio: 1; background: var(--cream-2); border-radius: 6px; display: grid; place-items: center; overflow: hidden; position: relative;
  border: 8px solid #fff; box-shadow: 0 8px 18px -10px rgba(47,61,51,.45); transform: rotate(-2deg);
}
.entry-photo img { width: 100%; height: 100%; object-fit: cover; }
.entry-photo .ph { text-align: center; color: var(--ink-3); font-size: 13px; padding: 10px; }
.entry-photo .ph span { display: block; font-size: 30px; margin-bottom: 4px; }
.entry-photo .ph-btn { position: absolute; inset: 0; border: 0; background: transparent; cursor: pointer; }
.entry-photo .rm { position: absolute; top: 4px; right: 4px; background: rgba(255,253,248,.9); }
.entry h3 { font-size: 22px; }
.entry .when { font: italic 500 14px/1 var(--f-display); color: var(--ochre); margin-bottom: 4px; }
.fav {
  margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--ochre-soft); position: relative;
}
.fav .lbl { font: 600 19px/1 var(--f-hand); color: var(--ochre); display: block; margin-bottom: 4px; }

.lined {
  background-image: repeating-linear-gradient(transparent 0 27px, var(--line) 27px 28px);
  line-height: 28px !important; padding-top: 0 !important; border: 0 !important; border-radius: 0 !important; background-color: transparent !important; box-shadow: none !important;
}

/* ==========================================================================
   Sheet (modal) + toast
   ========================================================================== */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(46,26,20,.45); animation: fade .25s ease both; }
.sheet-panel {
  position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 22px 22px 0 0; padding: 10px 18px calc(22px + var(--safe-b));
  box-shadow: var(--shadow-3); animation: sheetUp .38s var(--ease) both;
}
.sheet-panel::before { content: ""; display: block; width: 42px; height: 5px; border-radius: 9px; background: var(--line-2); margin: 0 auto 12px; }
@media (min-width: 720px) {
  .sheet { align-items: center; padding: 24px; }

  .sheet-panel::before { display: none; }
}
.sheet.closing .sheet-backdrop { animation: fade .2s ease reverse both; }
.sheet.closing .sheet-panel { animation: sheetUp .22s ease reverse both; }
@keyframes fade { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes sheetPop { from { opacity: 0; transform: translateY(16px) scale(.97); } }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

.more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.more-grid button {
  display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 6px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--cream); font: 600 12.5px/1.15 var(--f-body); color: var(--ink); text-align: center;
}
.more-grid button[aria-current="page"] { background: var(--mint); border-color: var(--sage); }
.more-grid .ico { width: 30px; height: 30px; font-size: 24px; }
.pick-list { display: flex; flex-direction: column; gap: 10px; }
.pick { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--cream); }
.pick .row { gap: 8px; }

.toasts { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 14px); transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
@media (min-width: 960px) { .toasts { bottom: 24px; left: calc(50% + 128px); } }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; border-radius: 14px;
  background: var(--espresso); color: var(--cream); box-shadow: var(--shadow-3); font-size: 14px; font-weight: 500;
  animation: toastIn .4s var(--spring) both;
}
.toast.out { animation: toastOut .25s ease both; }
.toast span { flex: 1; }
.toast button { border: 0; background: rgba(251,246,236,.14); color: var(--cream); font-weight: 700; padding: 7px 12px; border-radius: 99px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }

/* backup card */
.backup-card { background: var(--cream); border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

}

/* ==========================================================================

   ========================================================================== */

.start-art svg { width: 100%; height: 100%; display: block; }

.entry { grid-template-columns: 1fr !important; }

.polaroid .pic { font-size: 38px; aspect-ratio: 16 / 9; }
.polaroid .link { display: inline-flex; align-items: center; gap: 4px; margin: 6px 2px 0; font: 600 12.5px/1.2 var(--f-body); color: var(--sage-deep); text-decoration: none; border-bottom: 1.5px solid currentColor; }

.sync-pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-body); color: var(--ink-3); white-space: nowrap; }

.me-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 3px 10px 3px 3px; font: 600 12.5px/1 var(--f-body); }

.boot, .start { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
.boot { background: var(--cream); }
.boot .card, .start .card { width: min(460px, 100%); }

.start-card { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow-3); padding: 26px 22px 22px; transform: rotate(-.6deg); position: relative; }
.start-card::before { content: ""; position: absolute; top: -12px; left: 50%; width: 120px; height: 26px; transform: translateX(-50%) rotate(-3deg); background: rgba(224,169,59,.55); border-radius: 2px; }
.start-card .wordmark { font: 600 34px/1 var(--f-display); letter-spacing: -.02em; color: var(--espresso); text-align: center; }

.logo { display: block; height: auto; }
.side-brand .wordmark .logo { width: 150px; }
.brandmark .logo { height: 36px; width: auto; }

/* ==========================================================================
   City extras — only show up for cities whose file turns them on:
   closed-day warnings, book-first alerts, tip cards, tourist tax,
   price guide and the pocket guide tab
   ========================================================================== */
.chip.vibe { background: var(--vibe-bg, var(--cream-2)); color: var(--vibe-ink, var(--ink-2)); }

.tax-sum b { font: 600 26px/1 var(--f-display); }
.price-list { display: flex; flex-direction: column; }
.price-row { display: grid; grid-template-columns: minmax(0, 1fr) 100px 62px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.price-row:first-child { border-top: 0; }
.price-row .pl b { display: block; font-weight: 600; font-size: 14px; line-height: 1.25; }
.price-row .pl small { display: block; font-size: 12px; color: var(--ink-3); }
.price-row .input { min-height: 38px; padding: 6px 8px 6px 26px; font-size: 15px; }
.price-row .money-input .cur { left: 10px; }
.price-row .pg { text-align: right; font-weight: 700; font-size: 13px; }
.price-row .pg small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-3); }
.price-note { margin-top: 10px; }
.price-note .hand { font-size: 18px; color: var(--ochre); }

.pocket-band { height: 16px; border-radius: 99px; margin: -4px 0 14px; background: var(--pattern, var(--mint)); }
.pocket-jump { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; margin: 0 -16px 4px; scrollbar-width: none; position: sticky; top: 58px; z-index: 10; background: linear-gradient(var(--cream) 80%, transparent); }
.pocket-jump::-webkit-scrollbar { display: none; }
@media (min-width: 960px) { .pocket-jump { top: 66px; margin: 0 -36px 4px; padding: 4px 36px 10px; } }
.pocket-jump .daypill { flex-direction: row; gap: 7px; text-transform: none; letter-spacing: 0; font-size: 13.5px; min-width: 0; padding: 8px 14px; }
.pocket-jump .daypill .ico { width: 20px; height: 20px; font-size: 16px; }
.pocket-sec { scroll-margin-top: 130px; }
.pocket-sec .section-title .ico { width: 32px; height: 32px; font-size: 22px; }
.pocket-intro { margin: -4px 0 12px; font-size: 14px; }
.phrase-grid { display: grid; gap: 10px; }
@media (min-width: 620px) { .phrase-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1180px) { .phrase-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.phrase { background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--sage); border-radius: var(--r); padding: 13px 14px 12px; box-shadow: var(--shadow-1); }
.phrase h3 { font-size: 21px; line-height: 1.15; }
.phrase .pron { font: 700 13px/1.3 var(--f-body); letter-spacing: .04em; color: var(--sage-deep); margin-top: 5px; }
.phrase .use { font-size: 13.5px; color: var(--ink-2); margin-top: 5px; }
.say-btn { width: 36px; height: 36px; margin: -6px -6px 0 0; font-size: 16px; }
.custom-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.custom-list li { display: flex; gap: 12px; align-items: flex-start; }
.custom-list .vote-rank { width: 34px; height: 34px; font-size: 16px; flex: none; }
.custom-list b { display: block; font-weight: 700; }
.custom-list p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.fact-grid { display: grid; gap: 20px; padding-top: 8px; }
@media (min-width: 720px) { .fact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fact .hand { font-size: 22px; color: var(--ochre); display: block; margin-bottom: 4px; line-height: 1.1; }
.fact p { font-size: 14.5px; }

/* Paris theme: French café / vintage hotel.
   Warm cream base, dusty blue-grey, espresso brown, café-au-lait tan, and a little dusty pink.
   No bright red or primary blue anywhere. The teal Booked & Busy logo stays as it is. */
:root {
  /* the five Paris colors */
  --p-cream: #F3E3CC;
  --p-pink: #E8B7B8;
  --p-blue: #949FB3;
  --p-espresso: #5C3127;
  --p-tan: #B9866F;

  --cream: var(--p-cream);            /* main background */
  --cream-2: #EAD4B8;
  --paper: #FCF5EA;
  --mint: #E2E5EB;                    /* soft blue-grey wash: active tabs, calm chips */
  --mint-2: #CBD1DC;
  --sage: var(--p-blue);              /* secondary accent */
  --sage-deep: #5E6A80;               /* deep blue-grey: checkmarks, switches, labels */
  --ochre: #8E5B48;                   /* café-au-lait, deepened so white button text stays readable */
  --ochre-soft: #F4DEDC;              /* dusty-pink wash: highlights */
  --espresso: var(--p-espresso);      /* headings, text, outlines */
  --ink: var(--p-espresso);
  --ink-2: rgba(92, 49, 39, .76);
  --ink-3: rgba(92, 49, 39, .54);
  --line: rgba(92, 49, 39, .14);
  --line-2: rgba(92, 49, 39, .24);
  --red: #9E4A43;                     /* muted brick, only for "urgent" and "closed" */
  --red-soft: #F3DDD7;
  --amber: #B1813A;
  --amber-soft: #F2E1C2;
  --green-soft: var(--mint);
  --vibe-bg: #F2D3D3;                 /* vibe tags use the dusty pink */
  --vibe-ink: #7E4A4B;

  --f-display: "Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "DM Sans", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;

  --shadow-1: 0 1px 0 rgba(92,49,39,.04), 0 2px 6px rgba(92,49,39,.07);
  --shadow-2: 0 2px 0 rgba(92,49,39,.04), 0 10px 26px -8px rgba(92,49,39,.24);
  --shadow-3: 0 24px 60px -20px rgba(92,49,39,.45);

  /* Signature pattern: blue-grey and cream diamond checkerboard (pure CSS). */
  --pattern: conic-gradient(from 45deg, var(--p-blue) 25%, var(--p-cream) 0 50%, var(--p-blue) 0 75%, var(--p-cream) 0) 0 0 / 16px 16px;
}

/* Playfair runs a little larger than Fraunces at the same size; pull headings in slightly */
h1, h2, h3, h4 { letter-spacing: 0; }
.view-head h1 { font-size: clamp(30px, 7vw, 42px); }

/* ---- pattern: header band, card trim, start card — not everywhere ---- */
.hero-photo::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 18px; z-index: 2;
  background: var(--pattern); border-bottom: 2px solid var(--p-espresso);
}
.washi::before { background: var(--pattern); opacity: .95; height: 20px; border: 1.5px solid rgba(92,49,39,.25); }
.washi.ochre-tape::before { background: repeating-linear-gradient(90deg, rgba(255,255,255,.3) 0 6px, transparent 6px 12px), var(--p-tan); border: 0; }
.washi.mint-tape::before { background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px), var(--p-pink); border: 0; }
.start-card::before { background: var(--pattern); height: 22px; opacity: .95; border: 1.5px solid rgba(92,49,39,.25); }
.side-brand::after { content: ""; display: block; height: 10px; margin-top: 16px; border-radius: 99px; background: var(--pattern); opacity: .9; }

/* ---- colors the shared styles hard-code for Rome ---- */
body::before {
  background-image: radial-gradient(rgba(185,134,111,.07) 1px, transparent 1px), radial-gradient(rgba(92,49,39,.035) 1px, transparent 1px);
}
.btn.primary:hover { box-shadow: 0 4px 0 -1px var(--p-espresso); }
.input:focus, .select:focus, .textarea:focus { box-shadow: 0 0 0 4px rgba(148,159,179,.32); }
.input.bare:hover, .textarea.bare:hover { background: rgba(92,49,39,.03); }
.vote-item.leader { border-color: rgba(185,134,111,.6); }
.chip.ochre { background: #F0E0D3; color: var(--ochre); }   /* booking hints: tan, so pink stays rare */
.tile.t3 { background: #EFDCCB; }
.tile.t4 { background: #E6E1D9; }
.tip { background: var(--mint); color: var(--ink); }
.hero-photo::after { background: linear-gradient(180deg, rgba(92,49,39,0) 35%, rgba(92,49,39,.5) 100%); }
.postmark { border-color: rgba(92,49,39,.55); color: rgba(92,49,39,.65); }
.postmark::before { border-color: rgba(92,49,39,.4); }
.postmark .wave { stroke: rgba(92,49,39,.5); }
.stamp-inner { background: var(--ochre-soft); border-color: var(--p-tan); }
.stamp-inner .roma { font-style: italic; }
.bottomnav { box-shadow: 0 -8px 24px -18px rgba(92,49,39,.4); }
.polaroid { box-shadow: 0 1px 1px rgba(0,0,0,.05), 0 10px 20px -10px rgba(92,49,39,.35); }
.sheet-backdrop { background: rgba(60,32,25,.45); }
.pack-cat.paris { background: linear-gradient(180deg, var(--ochre-soft), var(--paper) 70%); }
.day-head .dnum, .stamp-inner .lbl { color: var(--sage-deep); }
.phrase { border-left-color: var(--p-tan); }

</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => {
  if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;

  return new Date(y, m - 1, d);
};
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

/** Today's date at local midnight. `?today=YYYY-MM-DD` previews another day. */
function today() {
  let o = null;
  try { o = parseISO(new URLSearchParams(location.search).get('today')); } catch (e) { /* ignore */ }

function money(c) {

function parseMoney(v) {

/* ==========================================================================
   Seed data — a realistic sample trip (from the city file) so the app looks alive on day one
   ========================================================================== */
function makeSeed() {
  const t = today();
  const sm = CITY.sample;
  let start = addDays(t, sm.startInDays);
  // Nudge the sample forward so none of its plans land on a day that venue is closed.
  for (let k = 0; k < 7 && sm.itinerary.some((x) => closureFor(x.title, addDays(start, x.day))); k++) start = addDays(start, 1);
  const end = addDays(start, sm.nights);
  const D = (n) => isoOf(addDays(start, n));
  const gid = (i) => 'g' + (i + 1);
  const g = sm.guests.map((x, i) => ({ id: gid(i), name: x.name, color: GUEST_COLORS[i], diet: x.diet || '', arrive: x.arriveDay != null ? D(x.arriveDay) : '', depart: x.departDay != null ? D(x.departDay) : '', confirmed: x.confirmed !== false }));
  const V = (ix) => ix.map(gid);

  const activities = sm.activities.map((a) => ({ ...a, votes: V(a.votes), custom: false }));

  const bookings = sm.bookings.map(({ bookByDay, ...b }) => ({
    ...b,
    bookBy: b.lead != null ? D(-b.lead) : D(bookByDay),
    assignee: b.assignee == null ? '' : gid(b.assignee),
  }));

  let n = 0;
  const itinerary = sm.itinerary.map((x) => ({ id: 'i' + (++n), day: x.day, time: x.time, title: x.title, note: x.note || '', activityId: x.activityId || '', bookingId: x.bookingId || '', cost: x.cost || 0 }));

  const expenses = sm.expenses.map(({ daysAgo, ...e }) => ({
    ...e,
    date: isoOf(addDays(t, -daysAgo)),
    paidBy: gid(e.paidBy),
    participants: V(e.participants),
    custom: Object.fromEntries(Object.entries(e.custom || {}).map(([k, v]) => [gid(+k), v])),
  }));

  const packing = [];
  g.forEach((guest, gi) => {
    let k = 0;
    PACK_CATS.forEach((c) => PACK_TEMPLATE[c.id].forEach((text) => {
      packing.push({ id: uid(), guestId: guest.id, cat: c.id, text, done: ((k++ * 7) % 10) / 10 < sm.packedRate[gi] });
    }));
  });

  const dream = sm.dream.map((d) => ({ ...d, link: d.link || '', promoted: '' }));
  const journal = sm.journal.map((j) => ({ ...j, quote: j.quote || '' }));

  return {
    schema: SCHEMA,
    trip: { name: sm.tripName, start: isoOf(start), end: isoOf(end), budget: sm.budget, currency: '€' },
    guests: g, activities, itinerary, expenses, bookings, packing, dream, journal,
    ...cityExtras(),
  };
}

/** Extra trip data only some cities use (price guide, tourist-tax calculator). */
function cityExtras() {
  const out = {};
  const bud = CITY.budget || {};
  if (bud.prices) out.prices = bud.prices.map((x) => ({ ...x }));
  if (bud.touristTax) out.tax = { stay: bud.touristTax.default, adults: '', nights: '', nightly: '' };
  return out;
}

/** Blank trip that keeps the city know-how (ideas, booking tips) but none of the sample people or money. */
function makeBlank() {
  const s = makeSeed();
  return {
    ...s,
    trip: { ...s.trip, name: S.blankTripName, budget: 0 },
    guests: [], itinerary: [], expenses: [], packing: [], journal: [],
    activities: s.activities.map((a) => ({ ...a, votes: [] })),
    bookings: s.bookings.map((b) => ({ ...b, assignee: '', booked: false, cost: 0, ref: '' })),
    dream: s.dream.map((d) => ({ ...d, promoted: '' })),
  };
}

/** Fill in anything missing without touching well-formed data (keeps backups round-tripping exactly). */
function normalize(d) {
  const blank = { schema: SCHEMA, trip: { name: S.blankTripName, start: '', end: '', budget: 0, currency: '€' },
    guests: [], activities: [], itinerary: [], expenses: [], bookings: [], packing: [], dream: [], journal: [] };
  const out = { ...blank, ...d, trip: { ...blank.trip, ...(d.trip || {}) } };
  for (const k of ['guests', 'activities', 'itinerary', 'expenses', 'bookings', 'packing', 'dream', 'journal']) if (!Array.isArray(out[k])) out[k] = [];
  const extras = cityExtras();
  if (extras.prices && !Array.isArray(out.prices)) out.prices = extras.prices;
  if (extras.tax) out.tax = { ...extras.tax, ...(isObj(out.tax) ? out.tax : {}) };
  // photos were removed; drop any leftovers so trips stay small enough to sync
  delete out.trip.heroImg;
  out.dream.forEach((d) => { if ('img' in d) delete d.img; if (d.link == null) d.link = ''; });
  out.journal.forEach((j) => { if ('img' in j) delete j.img; if (j.quote == null) j.quote = ''; });
  return out;
}

let state;

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* fall through to seed */ }

}
function save() { if (SYNC.on) { schedulePush(); return; } clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250); }
function flush() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (SYNC.on) { push(); return; }
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    lastSaved = Date.now();
    const s = $('#saveState');
    if (s) { s.textContent = 'Saved ✓'; s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); }

/* ---------- selectors ---------- */
const guest = (id) => state.guests.find((g) => g.id === id);
function tripDays() {
  const s = parseISO(state.trip.start), e = parseISO(state.trip.end);
  if (!s) return [];
  const n = e ? clamp(diffDays(s, e), 0, 59) : 0;
  return Array.from({ length: n + 1 }, (_, i) => ({ i, date: addDays(s, i) }));
}
function tripPhase() {
  const days = tripDays();
  if (!days.length) return { phase: 'nodates' };
  const t = today();
  if (t < days[0].date) return { phase: 'before', until: diffDays(t, days[0].date) };

}

  if (e.mode === 'amount') { ps.forEach((g) => { out[g] = Math.round(+(e.custom || {})[g] || 0); }); return out; }
  if (e.mode === 'percent') {
    const raw = ps.map((g) => { const x = (e.amount * (+(e.custom || {})[g] || 0)) / 100; return { g, f: Math.floor(x), r: x - Math.floor(x) }; });
    let left = e.amount - raw.reduce((s, x) => s + x.f, 0);
    [...raw].sort((a, b) => b.r - a.r).forEach((x) => { if (left > 0 && left < raw.length + 1) { x.f += 1; left -= 1; } });

function urgency(b) {

  const d = parseISO(b.bookBy);
  if (!d) return { level: 'green', word: 'No deadline', label: 'No book-by date yet', days: Infinity };
  const n = diffDays(today(), d);
  if (n < 0) return { level: 'red', word: 'Overdue', label: `${pl(-n, 'day')} overdue`, days: n };
  if (n === 0) return { level: 'red', word: 'Urgent', label: 'Due today', days: 0 };
  if (n <= 3) return { level: 'red', word: 'Urgent', label: `${pl(n, 'day')} left`, days: n };
  if (n <= 14) return { level: 'amber', word: 'Coming up', label: `${pl(n, 'day')} left`, days: n };

function sortedBookings() {
  return [...state.bookings].sort((a, b) => (a.booked - b.booked) || ((a.bookBy || '9999') < (b.bookBy || '9999') ? -1 : (a.bookBy || '9999') > (b.bookBy || '9999') ? 1 : 0));

function packStats(gid) {
  const ids = new Set(state.guests.map((g) => g.id));
  const items = state.packing.filter((p) => (gid ? p.guestId === gid : ids.has(p.guestId)));
  const done = items.filter((p) => p.done).length;

const validVotes = (a) => a.votes.filter((id) => guest(id));
const isScheduled = (actId) => state.itinerary.some((i) => i.activityId === actId);
function rankedActivities() {
  return state.activities.map((a, idx) => ({ a, idx, n: validVotes(a).length })).sort((x, y) => (y.n - x.n) || (x.idx - y.idx));
}

function closureFor(text, date) {
  if (!date || !CITY.closures) return null;

function renderShell() {
  const urgent = state.bookings.filter((b) => urgency(b).level === 'red').length;
  const navBtn = (t) => `<li><button type="button" data-action="go" data-tab="${t.id}" ${ui.tab === t.id ? 'aria-current="page"' : ''}>${icon(t.id)}<span>${t.label}</span>${t.id === 'bookings' && urgent ? `<span class="badge" title="${urgent} urgent">${urgent}</span>` : ''}</button></li>`;
  patch($('#sidebar'), `
    <div class="side-brand">
      <div class="wordmark">${LOGO_SVG}</div>
      <div class="tagline">Everyone on the same page.</div>
      <span class="edition-chip">${CITY.localName}</span>
    </div>
    <ul class="navlist">${TABS.map(navBtn).join('')}</ul>
    <div class="side-foot">${backupCard()}</div>`);

  const active = BOTTOM_TABS.includes(ui.tab) ? ui.tab : 'more';
  patch($('#bottomnav'), BOTTOM_TABS.map((id) => {
    const t = TABS.find((x) => x.id === id);
    return `<button type="button" data-action="go" data-tab="${id}" ${active === id ? 'aria-current="page"' : ''}>${icon(id)}<span>${t.short}</span></button>`;
  }).join('') + `<button type="button" data-action="more" ${active === 'more' ? 'aria-current="page"' : ''}><span class="ico" aria-hidden="true">☰</span><span>More${urgent ? ` <span class="badge" style="position:absolute;top:8px;right:calc(50% - 22px)">${urgent}</span>` : ''}</span></button>`);

  const t = TABS.find((x) => x.id === ui.tab);
  patch($('#topbar'), `
    <div class="brandmark">${LOGO_SVG}</div>
    <span class="edition-chip only-mobile">${CITY.localName}</span>
    <span class="title-sm only-desktop">${esc(state.trip.name)} · ${esc(t.label)}</span>
    <span class="spacer"></span>
    ${SYNC.on ? `${meButton()}<span class="sync-pill ${SYNC.status}" title="${esc(syncLabel())}"><i></i><span class="only-desktop">${esc(syncLabel())}</span></span>

}

  const p = {
    download: '<path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
    upload: '<path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
    trash: '<path d="M4 7h16M10 11v6m4-6v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    share: '<path d="M8.5 13.5l7-4M8.5 10.5l7 4"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="18" cy="17" r="2.5"/>',

function backupCard() {
  if (SYNC.on) {
    return `<div class="backup-card">

    <p>Everything saves automatically and updates live for everyone who has this link.</p>
    <div class="btns">

    </div>

  }

  return `<div class="backup-card">
    <h4>Keep your trip safe</h4>
    <p>Everything saves to this browser automatically. Download a copy to keep it or move it to another device.</p>
    <div class="btns">

function viewHead(tabId, title, lede, actions = '') {

const emptyState = (art, hand, title, text, btn = '') => `<div class="empty"><div class="art">${art}</div><span class="hand">${hand}</span><h3>${title}</h3><p>${text}</p>${btn}</div>`;
const avatar = (g, cls = '') => (g ? `<span class="avatar ${cls}" style="--c:${g.color}" title="${esc(g.name)}">${esc(initials(g.name))}</span>` : '');
const gchip = (g, on, attrs) => `<button type="button" class="gchip" style="--c:${g.color}" aria-pressed="${on}" ${attrs}><span class="avatar">${esc(initials(g.name))}</span>${esc(firstName(g.name))}</button>`;
const bar = (p, cls = '') => `<div class="bar ${cls}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="--p:${clamp(p, 0, 100)}%"></i></div>`;
const noGuests = (what) => emptyState('💌', 'first step', 'Add your group', `Once your travelers are on the Guest List, ${what}.`, '<button type="button" class="btn primary" data-action="go" data-tab="guests">Go to Guest List</button>');
const check = (attrs, on, label = '') => `<span class="check"><input type="checkbox" ${attrs} ${on ? 'checked' : ''} ${label ? `aria-label="${esc(label)}"` : ''}><span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></span>`;

/* ==========================================================================
   HOME
   ========================================================================== */
const heroArt = () => CITY_HERO;

function countdownStamp() {
  const p = tripPhase();
  const days = tripDays();
  let big = '?', lbl = 'set your dates';
  if (p.phase === 'before') { big = p.until; lbl = p.until === 1 ? `day until ${CITY.name}` : `days until ${CITY.name}`; }
  else if (p.phase === 'during') { big = p.index + 1; lbl = `day ${p.index + 1} of ${days.length} · in ${CITY.name}`; }
  else if (p.phase === 'after') { big = '✓'; lbl = 'trip complete'; }
  const start = days[0] ? days[0].date : null;
  return `<div class="stamp-wrap" aria-label="${esc(`${big} ${lbl}`)}">
    <div class="stamp"><div class="stamp-inner"><div class="roma">${CITY.localName}</div><div class="big num">${big}</div><div class="lbl">${lbl}</div></div></div>
    <div class="postmark" aria-hidden="true"><span>${CITY.localName}<br>${start ? esc(start.toLocaleDateString(undefined, { day: '2-digit', month: 'short' })) : '— —'}<br>B&amp;B</span>
      <svg class="wave" viewBox="0 0 70 30" fill="none" stroke="rgba(47,61,51,.5)" stroke-width="2"><path d="M0 5q9-6 17 0t17 0 17 0 19 0M0 15q9-6 17 0t17 0 17 0 19 0M0 25q9-6 17 0t17 0 17 0 19 0"/></svg>
    </div>
  </div>`;
}

function viewHome() {
  const tr = state.trip;
  const days = tripDays();
  const spent = spentTotal();
  const ps = packStats();
  const p = tripPhase();
  const confirmed = state.guests.filter((g) => g.confirmed).length;
  let welcome = true;
  try { welcome = !localStorage.getItem(WELCOME_KEY + (SYNC.on ? ':' + SYNC.tripId : '')); } catch (e) { /* ignore */ }
  const remaining = tr.budget - spent;
  const unscheduled = state.activities.filter((a) => !isScheduled(a.id)).length;
  const voters = state.guests.filter((g) => state.activities.some((a) => a.votes.includes(g.id))).length;
  const daysLabel = p.phase === 'before' ? p.until : p.phase === 'during' ? `Day ${p.index + 1}` : p.phase === 'after' ? '✓' : '—';

  return `
  <div class="hero">
    <div class="hero-photo">
      <div class="hero-art">${heroArt()}</div>
      ${countdownStamp()}
      <div class="hero-inner">
        <div class="hero-card">
          ${doodle(1, 'right:-18px;top:-30px;width:70px;transform:rotate(10deg)')}
          <div class="kicker">Booked &amp; Busy · ${CITY.name}</div>
          <label class="sr-only" for="tripName">Trip name</label>
          <textarea id="tripName" class="trip-name autosize" rows="1" data-bind="trip::name" maxlength="80" placeholder="Name your trip">${esc(tr.name)}</textarea>
          <div class="date-row">
            <label class="sr-only" for="tripStart">Start date</label>
            <input id="tripStart" type="date" data-bind="trip::start" data-after="fixDates" value="${esc(tr.start)}">
            <span class="arrow">→</span>
            <label class="sr-only" for="tripEnd">End date</label>
            <input id="tripEnd" type="date" data-bind="trip::end" data-after="fixDates" value="${esc(tr.end)}" min="${esc(tr.start)}">
            ${days.length ? `<span class="chip mint">${pl(days.length, 'day')} · ${pl(Math.max(0, days.length - 1), 'night')}</span>` : ''}
          </div>
        </div>
      </div>
    </div>
  </div>

  ${welcome ? `<div class="card mint washi" style="margin-bottom:18px" data-key="welcome">
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:0">
        <span class="hand" style="font-size:21px;color:var(--ochre)">Start here</span>
        ${SYNC.on
          ? `<p style="margin-top:4px">Add everyone on the <button type="button" class="linkish" data-action="go" data-tab="guests">Guest List</button>, set your dates above, then send this link to your group. Anyone with the link can see and edit the trip, and changes show up for everyone right away.</p>
             <div class="share-box"><code>${esc(tripLink())}</code><button type="button" class="btn small primary" data-action="shareLink">Copy link</button></div>`
          : `<p style="margin-top:4px">This is a sample trip so you can see how everything works. Rename it above, set your dates, add your group on the Guest List, and edit or delete anything. Want a clean slate? <button type="button" class="linkish" data-action="resetMenu">Start with a blank trip</button>.</p>`}
      </div>
      <button type="button" class="icon-btn" data-action="dismissWelcome" aria-label="Dismiss">${svgIcon('x')}</button>
    </div>
  </div>` : ''}

  <div class="stats">
    <button type="button" class="card lift stat" data-action="go" data-tab="budget">
      <span class="kicker">Budget</span>${icon('budget')}
      <span class="v num">${money(spent)} <small>of ${money(tr.budget)}</small></span>
      ${bar(pct(spent, tr.budget), `ochre ${spent > tr.budget && tr.budget ? 'over' : ''}`)}
      <span class="s">${tr.budget ? (remaining >= 0 ? `${money(remaining)} left` : `${money(-remaining)} over budget`) : 'Set a total budget →'}</span>
    </button>
    <button type="button" class="card lift stat" data-action="go" data-tab="packing">
      <span class="kicker">Packing</span>${icon('packing')}
      <span class="v num">${ps.pct}<small>% packed</small></span>
      ${bar(ps.pct)}
      <span class="s">${ps.total ? `${ps.done} of ${ps.total} items across the group` : 'No packing lists yet'}</span>
    </button>
    <button type="button" class="card lift stat" data-action="go" data-tab="itinerary">
      <span class="kicker">${p.phase === 'during' ? `In ${CITY.name}` : p.phase === 'after' ? 'Trip' : 'Countdown'}</span>${icon('itinerary')}
      <span class="v num">${daysLabel} <small>${p.phase === 'before' ? (p.until === 1 ? 'day to go' : 'days to go') : p.phase === 'during' ? `of ${days.length}` : p.phase === 'after' ? 'complete' : 'no dates yet'}</small></span>
      <span class="s">${days.length ? `${fmtDay(days[0].date)} → ${fmtDay(days[days.length - 1].date)}` : 'Add dates in the card above'}</span>
    </button>
    <button type="button" class="card lift stat" data-action="go" data-tab="guests">
      <span class="kicker">Group</span>${icon('guests')}
      <span class="v num">${confirmed}<small> of ${state.guests.length} confirmed</small></span>
      <span class="avatars">${state.guests.slice(0, 8).map((g) => avatar(g, 'sm')).join('')}</span>
      <span class="s">${state.guests.length - confirmed ? `${pl(state.guests.length - confirmed, 'person')} still deciding` : state.guests.length ? 'Everyone’s confirmed' : 'Add your travelers'}</span>
    </button>
  </div>

  <div class="section">
    <h2 class="section-title">Quick links</h2>
    <div class="tiles">
      <button type="button" class="tile t1" data-action="go" data-tab="itinerary">${icon('itinerary')}<div><b>Itinerary</b><span>${pl(state.itinerary.length, 'plan')} across ${pl(days.length, 'day')}</span></div><span class="go">→</span></button>
      <button type="button" class="tile t2" data-action="go" data-tab="budget">${icon('budget')}<div><b>Budget</b><span>${money(spent)} logged · ${pl(settleUp().length, 'payback')}</span></div><span class="go">→</span></button>
      <button type="button" class="tile t3" data-action="go" data-tab="packing">${icon('packing')}<div><b>Packing</b><span>${ps.pct}% of the group packed</span></div><span class="go">→</span></button>
      <button type="button" class="tile t4" data-action="go" data-tab="vote">${icon('vote')}<div><b>Group Picks</b><span>${pl(unscheduled, 'idea')} to decide · ${pl(voters, 'voter')}</span></div><span class="go">→</span></button>
    </div>
  </div>`;
}

/* ==========================================================================
   DASHBOARD
   ========================================================================== */
function agendaList(items, highlightNext) {
  const now = new Date();
  const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const nextId = highlightNext ? (items.find((i) => i.time && i.time >= hhmm) || {}).id : null;
  return `<ul class="agenda">${items.map((i) => `<li style="${i.id === nextId ? 'background:var(--ochre-soft);border-radius:10px;padding-left:8px;padding-right:8px;margin:0 -8px' : ''}">
    <span class="t">${i.time ? fmtTime(i.time) : 'Anytime'}</span>
    <div><div class="ti">${esc(i.title)} ${i.id === nextId ? '<span class="chip ochre" style="margin-left:4px">Up next</span>' : ''}</div>${i.note ? `<div class="no">${esc(i.note)}</div>` : ''}</div>
  </li>`).join('')}</ul>`;
}
const itemsForDay = (i) => state.itinerary.filter((x) => x.day === i).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1);

function viewDashboard() {
  const p = tripPhase();
  const days = tripDays();
  let todayCard;
  if (p.phase === 'nodates') {
    todayCard = emptyState('🗓️', 'no dates yet', 'When are you going?', 'Add your trip dates on the Home page to see each day’s plan here.', '<button type="button" class="btn primary" data-action="go" data-tab="home">Set trip dates</button>');
  } else if (p.phase === 'before') {
    const first = itemsForDay(0);
    todayCard = `<div class="card washi today-card">
      <div class="kicker">Today · ${esc(fmtLong(today()))}</div>
      <h3 style="font-size:26px;margin:6px 0 4px">The trip hasn’t started yet</h3>
      <p class="muted">${p.until === 1 ? 'Tomorrow is the day.' : `${p.until} days until ${CITY.name}.`} Here’s how Day 1 looks so far:</p>
      <div style="margin-top:12px"><div class="dayname">Day 1 · ${esc(fmtDay(days[0].date))}</div>
      ${first.length ? agendaList(first) : '<p class="faint" style="padding:10px 0">Nothing planned for Day 1 yet.</p>'}</div>
      <button type="button" class="btn small" data-action="go" data-tab="itinerary" style="margin-top:8px">See the full itinerary →</button>
    </div>`;
  } else if (p.phase === 'during') {
    const its = itemsForDay(p.index);
    todayCard = `<div class="card washi ochre-tape today-card" style="border:2px solid var(--ochre)">
      <div class="kicker">Today · Day ${p.index + 1} of ${days.length}</div>
      <h3 style="font-size:26px;margin:6px 0 10px">${esc(fmtLong(days[p.index].date))}</h3>
      ${its.length ? agendaList(its, true) : '<p class="faint" style="padding:10px 0">Nothing planned today.</p>'}
      <div class="row wrap" style="margin-top:10px">
        <button type="button" class="btn small" data-action="go" data-tab="itinerary">Full itinerary</button>
        <button type="button" class="btn small" data-action="writeDay" data-day="${p.index}">Write today’s memory</button>
      </div>
    </div>`;
  } else {
    todayCard = `<div class="card espresso today-card">
      <div class="kicker">After the trip</div>
      <h3 style="font-size:28px;margin:8px 0 6px">That’s a wrap.</h3>
      <p style="opacity:.8;margin-bottom:14px">Write down the highlights while they’re fresh, and settle up anything that’s left.</p>
      <div class="row wrap"><button type="button" class="btn primary" data-action="go" data-tab="memories">Open Memories</button>
      <button type="button" class="btn small" style="background:transparent;color:var(--cream);border-color:rgba(251,246,236,.5)" data-action="go" data-tab="budget">Settle up</button></div>
    </div>`;
  }

  const unbooked = state.bookings.filter((b) => !b.booked);
  const urgentN = unbooked.filter((b) => urgency(b).level === 'red').length;
  const ps = packStats();
  const ranked = rankedActivities().filter((r) => !isScheduled(r.a.id) && r.n > 0);
  const half = Math.ceil(state.guests.length / 2);
  const favs = ranked.filter((r) => r.n >= half);
  const tie = ranked.length > 1 && ranked[0].n === ranked[1].n ? ranked.filter((r) => r.n === ranked[0].n) : [];
  const nonVoters = state.guests.filter((g) => !state.activities.some((a) => a.votes.includes(g.id)));
  const settle = settleUp();
  const pending = state.guests.filter((g) => !g.confirmed);
  const row = (n, label, sub, tab) => `<li><button type="button" data-action="go" data-tab="${tab}"><span class="n num ${n ? '' : 'zero'}">${n || '✓'}</span><span class="lbl">${label}<small>${sub}</small></span><span class="chev">→</span></button></li>`;

  const spent = spentTotal();
  const b = state.trip.budget;
  const next = sortedBookings().filter((x) => !x.booked).slice(0, 3);

  return viewHead('dashboard', `Today`, 'Today’s plan, what’s still open, and where the budget stands.') + `
  <div class="grid cols-2">
    <div class="span-2">${todayCard}</div>
    ${bookFirstCard(p)}
    <div class="card">
      <div class="card-head"><h3>What’s left to do</h3></div>
      <ul class="todo-list">
        ${row(unbooked.length, unbooked.length === 1 ? 'booking still to make' : 'bookings still to make', urgentN ? `${urgentN} urgent — book these first` : unbooked.length ? 'Nothing urgent yet' : 'All booked!', 'bookings')}
        ${row(ps.total - ps.done, 'items left to pack', `${ps.pct}% packed across the group`, 'packing')}
        ${row(favs.length, favs.length === 1 ? 'crowd favorite not scheduled' : 'crowd favorites not scheduled', tie.length ? `Tie: ${tie.slice(0, 3).map((r) => esc(r.a.title.split(/[—(+&]/)[0].trim())).join(' vs. ')} (${pl(tie[0].n, 'vote')} each)` : nonVoters.length ? `${pl(nonVoters.length, 'person hasn’t', 'people haven’t')} voted yet` : 'Everyone has voted', 'vote')}
        ${row(settle.length, settle.length === 1 ? 'payment to settle up' : 'payments to settle up', settle.length ? `Largest: ${money(Math.max(...settle.map((s) => s.amount)))}` : 'Everyone’s square', 'budget')}
        ${row(pending.length, pending.length === 1 ? 'guest still deciding' : 'guests still deciding', pending.length ? pending.map((g) => esc(firstName(g.name))).join(', ') : 'Everyone’s confirmed', 'guests')}
        ${CITY.closures ? (() => { const c = closedPlans(); return row(c.length, c.length === 1 ? 'plan on a closed day' : 'plans on a closed day', c.length ? c.map((i) => esc(itemClosure(i).venue)).join(', ') : 'No clashes with closing days', 'itinerary'); })() : ''}
      </ul>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-head"><h3>Budget</h3><button type="button" class="btn small ghost" data-action="go" data-tab="budget">Details →</button></div>
        <div class="row between" style="margin-bottom:8px"><span class="big-money num" style="font-size:30px">${money(spent)}</span><span class="muted" style="font-weight:600">of ${money(b)}</span></div>
        ${bar(pct(spent, b), `fat ochre ${spent > b && b ? 'over' : ''}`)}
        <p class="muted" style="margin-top:8px;font-size:13.5px">${b ? (b - spent >= 0 ? `${money(b - spent)} remaining` : `${money(spent - b)} over`) : 'No total budget set'}${state.guests.length && b ? ` · ${money(Math.round(b / state.guests.length))} per person planned` : ''}</p>
      </div>
      <div class="card">
        <div class="card-head"><h3>Next deadlines</h3></div>
        ${next.length ? next.map((x) => { const u = urgency(x); return `<button type="button" class="settle" style="width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit" data-action="go" data-tab="bookings"><span class="dot ${u.level}"></span><span style="flex:1;min-width:0"><b style="display:block;font-weight:600">${esc(x.title)}</b><small class="muted">Book by ${esc(fmtDate(parseISO(x.bookBy))) || '—'} · ${esc(u.label)}</small></span></button>`; }).join('') : '<p class="muted">Nothing left to book.</p>'}
      </div>
    </div>
    ${gettingAroundCard()}
    <div class="span-2 only-mobile">${backupCard()}</div>
  </div>`;
}

/** "Book these first": big-ticket bookings whose booking window the trip is now inside. */
function bookFirstCard(p) {
  if (!CITY.bookFirst || p.phase !== 'before') return '';
  const list = CITY.bookFirst.map((r) => ({ r, b: state.bookings.find((x) => x.id === r.bookingId) })).filter(({ r, b }) => b && !b.booked && p.until <= r.windowDays);
  if (!list.length) return '';
  return `<div class="span-2"><div class="card book-first" data-key="book-first">
    <div class="card-head">${art('eiffel-tower', '🎟️')}<h3>Book these first</h3><span class="chip red">${pl(p.until, 'day')} to go</span></div>
    <p class="muted" style="font-size:13.5px;margin:-4px 0 4px">Your trip is inside the booking window for ${list.length === 1 ? 'this one' : 'these'}, and ${list.length === 1 ? 'it sells' : 'they sell'} out first.</p>
    ${list.map(({ r, b }) => `<button type="button" class="settle" style="width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit" data-action="go" data-tab="bookings"><span class="dot ${urgency(b).level}"></span><span style="flex:1;min-width:0"><b style="display:block;font-weight:600">${esc(b.title)}</b><small class="muted">${esc(r.why)}</small></span><span class="chev">→</span></button>`).join('')}
  </div></div>`;
}
function gettingAroundCard() {
  const ga = CITY.gettingAround;
  if (!ga) return '';
  return `<div class="span-2"><div class="card" data-key="getting-around">
    <div class="card-head"><h3>${esc(ga.title)}</h3></div>
    <div class="tip-cards">${ga.tips.map((t) => `<div class="tip-card">${art(t.icon, t.emoji)}<div><b>${esc(t.head)}</b><p>${esc(t.text)}</p></div></div>`).join('')}</div>
  </div></div>`;
}

/* ==========================================================================
   GUEST LIST
   ========================================================================== */
function viewGuests() {
  const gs = state.guests;
  const confirmed = gs.filter((g) => g.confirmed).length;
  const diets = dietNotes().length;
  const tr = state.trip;
  return viewHead('guests', `Who’s going`, 'Add everyone once. Their names show up in voting, packing, bookings and the budget automatically.') + `

}

/* ==========================================================================

function donut(segs, total) {
  const R = 15.9155;
  let acc = 0;
  const gap = segs.length > 1 ? 0.8 : 0;
  const circles = segs.map((s) => {
    const p = (s.v / total) * 100;
    const c = `<circle class="seg" cx="21" cy="21" r="${R}" fill="none" stroke="${s.color}" stroke-width="5.2" stroke-dasharray="${Math.max(0, p - gap).toFixed(3)} ${(100 - Math.max(0, p - gap)).toFixed(3)}" stroke-dashoffset="${(25 - acc).toFixed(3)}"><title>${esc(s.label)}: ${money(s.v)}</title></circle>`;
    acc += p;
    return c;
  }).join('');
  return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Spending by category">
    <circle cx="21" cy="21" r="${R}" fill="none" stroke="var(--cream-2)" stroke-width="5.2"/>
    ${circles}
    <text x="21" y="20.2" text-anchor="middle" style="font:600 5.2px var(--f-display);fill:var(--espresso)">${money(total)}</text>
    <text x="21" y="25.5" text-anchor="middle" style="font:700 2.3px var(--f-body);letter-spacing:.2px;fill:var(--ink-3);text-transform:uppercase">SPENT SO FAR</text>
  </svg>`;
}

function viewBudget() {
